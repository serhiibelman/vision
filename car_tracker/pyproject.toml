[project]
name = "car-tracker"
version = "0.1.0"
description = "Detect moving cars in nadir drone footage and plot their geo-referenced paths on a map"
requires-python = ">=3.10"

# NOTE: AGPL is inherited via the optional `detect` extra (ultralytics), which is
# copyleft. Installing only the core dependencies keeps this subproject on
# permissive licences (BSD / MIT / Apache-2.0). See docs/ for the note.
license = { text = "AGPL-3.0-or-later" }

# Core: required under every branch of the design. All permissive.
dependencies = [
    "numpy>=1.26",        # BSD
    "pandas>=2.2",        # BSD    — telemetry table
    "opencv-python>=4.10", # Apache-2.0 — video decode, optical flow, warping
    "pyproj>=3.6",        # MIT    — local ENU / geodesy
    "folium>=0.17",       # MIT    — map output
    "scipy>=1.13",        # BSD    — linear_sum_assignment, savgol_filter
]

[project.optional-dependencies]
# Quarantined so removal stays a one-line change and the copyleft boundary is explicit.
# torch/torchvision are pulled in transitively; install them FIRST from the correct
# index (CUDA vs CPU) because the wheel variant cannot be declared portably here:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu124
detect = ["ultralytics>=8.3"]   # AGPL-3.0
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
car-tracker = "car_tracker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/car_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src", "tests"]
# No python_version pin: numpy's bundled stubs use 3.12-only syntax, so checking
# against the 3.10 floor declared above fails inside numpy rather than in our code.
# cv2, folium, ultralytics and pyproj ship no stubs; typing our own code is the point,
# not re-typing theirs.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Full annotations are required of the package itself. Tests are read as prose and are
# left out of that rule deliberately — annotating every fixture buys nothing.
module = "car_tracker.*"
disallow_untyped_defs = true
